name: Archive official Apple source pages

on:
  push:
    branches: [main]
    paths:
      - "source-archive-requests/**/*.json"

permissions:
  contents: write

concurrency:
  group: official-apple-source-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install archived-page extraction dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Download and preserve official Apple source HTML
        run: python scripts/archive_official_sources.py source-archive-requests
      - name: Extract archived legacy Apple Watch technical specifications
        if: contains(join(github.event.commits.*.added, ' '), 'source-archive-requests/apple-watch-legacy-technical-specifications.json') || contains(join(github.event.commits.*.modified, ' '), 'source-archive-requests/apple-watch-legacy-technical-specifications.json')
        run: python tools/extract_archived_legacy_watch_specs.py
      - name: Commit source archives and extracted records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple_remaining_extraction/technical_specs_html/ apple_watch_extraction/ data/apple/watch/
          if git diff --cached --quiet; then
            echo "No new or changed source archives."
            exit 0
          fi
          git commit -m "Archive official Apple technical specification sources"
          git push
