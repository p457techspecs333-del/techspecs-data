name: Archive selected slim Samsung products

on:
  push:
    branches:
      - feature/samsung-galaxy-s-comparison
    paths:
      - "data/samsung/source-inventory.json"
      - "scripts/samsung_slim_ingest.py"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: samsung-slim-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install scraper and validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Archive selected Samsung product pages
        run: python scripts/samsung_slim_ingest.py --archive
      - name: Validate Samsung V2 records
        run: python scripts/validate_product_records.py
      - name: Audit source archives
        run: python scripts/audit_source_archives.py
      - name: Regenerate product catalogue and sitemap
        run: python scripts/build_catalogue_index.py
      - name: Commit archived sources, records and catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/samsung sources/samsung data/catalogue.json data/sitemap.xml
          if git diff --cached --quiet; then
            echo "No new Samsung records or catalogue changes."
            exit 0
          fi
          git commit -m "Archive selected Samsung comparison products"
          git push
