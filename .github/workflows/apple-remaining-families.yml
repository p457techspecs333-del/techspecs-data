name: Discover remaining Apple product families

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apple-remaining-families.yml"
      - "tools/apple_remaining_families_extractor.py"

permissions:
  contents: write

jobs:
  discover-remaining-families:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Discover and capture official sources
        run: python tools/apple_remaining_families_extractor.py
      - name: Commit source archives and inventories
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple_remaining_extraction/ data/apple/airpods/ data/apple/homepod/ data/apple/ipod/ data/apple/displays/ data/apple/accessories/ data/apple/software/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Discover official Apple sources for remaining families"
            git push
          fi
      - name: Upload discovery report and source archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-remaining-families-run
          path: apple_remaining_extraction/
          if-no-files-found: warn
          retention-days: 30
