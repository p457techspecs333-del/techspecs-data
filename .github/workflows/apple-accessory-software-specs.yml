name: Extract Apple accessory and software specifications

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apple-accessory-software-specs.yml"
      - "tools/apple_remaining_specs_link_extractor.py"

permissions:
  contents: write

jobs:
  extract-accessory-software-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Follow documentation indexes to technical specs
        run: python tools/apple_remaining_specs_link_extractor.py
      - name: Commit extracted specifications and archives
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple_remaining_extraction/ data/apple/airpods/ data/apple/accessories/ data/apple/software/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract official Apple accessory and software specifications"
            git push
          fi
      - name: Upload extraction report and archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-accessory-software-specs
          path: apple_remaining_extraction/
          if-no-files-found: warn
          retention-days: 30
