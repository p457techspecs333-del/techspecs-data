name: Capture official Apple TV specifications

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apple-tv-specs-extraction.yml"
      - "tools/apple_tv_specs_extractor.py"

permissions:
  contents: write

jobs:
  extract-apple-tv-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Capture official Apple TV specifications
        run: python tools/apple_tv_specs_extractor.py
      - name: Commit source archives and records
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple_tv_extraction/ data/apple/tv/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract official Apple TV specifications"
            git push
          fi
      - name: Upload extraction report and source archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-tv-specs-run
          path: apple_tv_extraction/
          if-no-files-found: warn
          retention-days: 30
