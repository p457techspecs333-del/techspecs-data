name: Scrape official Apple Mac specifications

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: write

jobs:
  scrape-apple-mac-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Scrape Apple's official model and Tech Specs pages
        run: python tools/apple_mac_specs_scraper.py
      - name: Commit captured Apple source HTML and extraction report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple_mac_extraction/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add captured official Apple Mac technical specifications"
            git push
          fi
      - name: Upload captured source HTML and extraction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-mac-specs-${{ github.run_number }}
          path: apple_mac_extraction/
          if-no-files-found: warn
          retention-days: 30
