name: Discover slim Samsung products

on:
  push:
    branches:
      - feature/samsung-galaxy-s-comparison
    paths:
      - "scripts/samsung_slim_ingest.py"
      - "config/samsung-slim-source-seeds.json"

permissions:
  contents: write

concurrency:
  group: samsung-slim-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: python -m pip install -r requirements.txt
      - name: Discover official Samsung Ireland product pages
        run: python scripts/samsung_slim_ingest.py --discover
      - name: Commit candidate inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/samsung/source-inventory.json
          if git diff --cached --quiet; then
            echo "Samsung candidate inventory is unchanged."
            exit 0
          fi
          git commit -m "Discover Samsung slim comparison source pages"
          git push
