name: Capture official Apple Vision Pro specifications

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apple-vision-specs-extraction.yml"
      - "tools/apple_vision_specs_extractor.py"

permissions:
  contents: write

jobs:
  extract-apple-vision-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Clear generated Vision captures
        run: rm -rf apple_vision_extraction/technical_specs_html apple_vision_extraction/extraction_report.json apple_vision_extraction/discovered_urls.json
      - name: Capture and extract official Apple Vision Pro specifications
        run: python tools/apple_vision_specs_extractor.py
      - name: Commit source archives and records
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple_vision_extraction/ data/apple/vision/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract official Apple Vision Pro specifications"
            git push
          fi
      - name: Upload extraction report and source archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-vision-specs-run
          path: apple_vision_extraction/
          if-no-files-found: warn
          retention-days: 30
