name: Validate records and build catalogue

on:
  push:
    branches: [main]
    paths:
      - "data/**/*.json"
      - "data/_redirects"
      - "data/llms.txt"
      - "data/index.html"
      - "schemas/**"
      - "scripts/validate_product_records.py"
      - "scripts/audit_source_archives.py"
      - "scripts/archive_official_sources.py"
      - "tools/extract_archived_legacy_watch_specs.py"
      - "scripts/smoke_test_live_data.py"
      - ".github/workflows/smoke-test-live-data.yml"
      - ".github/workflows/archive-official-apple-sources.yml"
      - "source-archive-requests/**/*.json"
      - "scripts/build_catalogue_index.py"
      - "requirements.txt"
      - ".github/workflows/validate-product-records.yml"
  pull_request:
    paths:
      - "data/**/*.json"
      - "tools/extract_archived_legacy_watch_specs.py"
      - "data/_redirects"
      - "data/llms.txt"
      - "data/index.html"
      - "schemas/**"
      - "scripts/validate_product_records.py"
      - "scripts/audit_source_archives.py"
      - "scripts/archive_official_sources.py"
      - "scripts/smoke_test_live_data.py"
      - ".github/workflows/smoke-test-live-data.yml"
      - ".github/workflows/archive-official-apple-sources.yml"
      - "source-archive-requests/**/*.json"
      - "scripts/build_catalogue_index.py"
      - "requirements.txt"
      - ".github/workflows/validate-product-records.yml"
  workflow_dispatch:

permissions:
  contents: write

# Serialize catalogue writers so concurrent data commits cannot race while
# publishing the generated catalogue and sitemap.
concurrency:
  group: validate-records-build-catalogue-main
  cancel-in-progress: false

jobs:
  validate-and-index:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install -r requirements.txt
      - name: Compile source archive helper
        run: python -m py_compile scripts/archive_official_sources.py
      - name: Compile legacy Watch extraction helper
        run: python -m py_compile tools/extract_archived_legacy_watch_specs.py
      - name: Compile legacy iPod extraction helper
        run: python -m py_compile tools/extract_archived_legacy_ipod_specs.py
      - name: Compile live smoke-test helper
        run: python -m py_compile scripts/smoke_test_live_data.py
      - name: Audit product records
        run: python scripts/validate_product_records.py
      - name: Audit archived source metadata
        run: python scripts/audit_source_archives.py
      - name: Generate machine-readable catalogue
        run: python scripts/build_catalogue_index.py
      - name: Require catalogue to be current in pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- data/catalogue.json data/sitemap.xml
      - name: Commit updated catalogue on main
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add data/catalogue.json data/sitemap.xml
            if git diff --cached --quiet; then
              echo "Catalogue is already up to date."
              exit 0
            fi
            git commit -m "Regenerate machine-readable product catalogue"
            if git push; then
              exit 0
            fi
            echo "Push raced with another main update; refreshing and rebuilding (attempt $attempt)."
            git fetch origin main
            git reset --hard origin/main
            python scripts/validate_product_records.py
            python scripts/build_catalogue_index.py
          done
          echo "Unable to publish catalogue after three attempts."
          exit 1
      - name: Smoke-test deployed catalogue and product routes
        if: github.event_name != 'pull_request'
        run: python scripts/smoke_test_live_data.py
