name: Validate records and build catalogue

on:
  push:
    branches: [main]
    paths:
      - "data/**/*.json"
      - "schemas/**"
      - "scripts/validate_product_records.py"
      - "scripts/build_catalogue_index.py"
      - "requirements.txt"
      - ".github/workflows/validate-product-records.yml"
  pull_request:
    paths:
      - "data/**/*.json"
      - "schemas/**"
      - "scripts/validate_product_records.py"
      - "scripts/build_catalogue_index.py"
      - "requirements.txt"
      - ".github/workflows/validate-product-records.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-index:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install -r requirements.txt
      - name: Audit product records
        run: python scripts/validate_product_records.py
      - name: Generate machine-readable catalogue
        run: python scripts/build_catalogue_index.py
      - name: Require catalogue to be current in pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- data/catalogue.json
      - name: Commit updated catalogue on main
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogue.json
          if git diff --cached --quiet; then
            echo "Catalogue is already up to date."
          else
            git commit -m "Regenerate machine-readable product catalogue"
            git push
          fi
